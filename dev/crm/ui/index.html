<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burq CRM</title>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="layout.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="components.css" />
  <style>
    .nav-item__icon { width: 18px; height: 18px; flex-shrink: 0; }
    .topbar__icon   { width: 18px; height: 18px; }
  </style>
</head>
<body>

<div class="layout layout--with-sidebar layout--with-topbar" id="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar__logo">
      <svg class="sidebar__logo-mark" viewBox="0 0 56 56" fill="none">
        <path d="M20 10 C16 10 14 12 14 16 L14 22 C14 24.5 12 26 10 28 C12 30 14 31.5 14 34 L14 40 C14 44 16 46 20 46" stroke="#f5f5f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M36 10 C40 10 42 12 42 16 L42 22 C42 24.5 44 26 46 28 C44 30 42 31.5 42 34 L42 40 C42 44 40 46 36 46" stroke="#f5f5f5" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M31 14 L22 29 L27.5 29 L25 42 L36 25 L30 25 L33 14 Z" fill="#F0A202"/>
      </svg>
      <span class="sidebar__logo-name">burq</span>
    </div>

    <nav class="sidebar__nav">
      <a class="nav-item nav-item--active" href="#">
        <i data-lucide="layout-dashboard" class="nav-item__icon"></i>
        <span class="nav-item__label">Dashboard</span>
      </a>
      <a class="nav-item" href="#">
        <i data-lucide="users" class="nav-item__icon"></i>
        <span class="nav-item__label">Contacts</span>
      </a>
      <a class="nav-item" href="#">
        <i data-lucide="circle-dollar-sign" class="nav-item__icon"></i>
        <span class="nav-item__label">Deals</span>
      </a>
      <a class="nav-item" href="#">
        <i data-lucide="activity" class="nav-item__icon"></i>
        <span class="nav-item__label">Activities</span>
      </a>
    </nav>

    <div class="sidebar__footer">
      <a class="nav-item" href="#">
        <i data-lucide="settings" class="nav-item__icon"></i>
        <span class="nav-item__label">Settings</span>
      </a>
    </div>
  </aside>

  <!-- TOPBAR -->
  <header class="topbar">
    <div class="topbar__left">
      <button class="topbar__toggle" id="sidebarToggle">
        <i data-lucide="menu" class="topbar__icon"></i>
      </button>
      <span class="topbar__title">Dashboard</span>
    </div>
    <div class="topbar__right">
      <button class="topbar__toggle">
        <i data-lucide="search" class="topbar__icon"></i>
      </button>
      <button class="topbar__toggle">
        <i data-lucide="bell" class="topbar__icon"></i>
      </button>
      <div style="width:32px;height:32px;border-radius:var(--radius-lg);background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:var(--text-sm);font-weight:700;color:var(--accent-foreground);cursor:pointer;">D</div>
    </div>
  </header>

  <!-- CONTENT -->
  <main class="content">
    <div class="col col--gap-lg"></div>
    
        <div class="table-wrapper">
  <div class="table-toolbar">
    <div class="table-toolbar__left">
      <div class="table-search">
        <i data-lucide="search" class="table-search__icon"></i>
        <input class="table-search__input" placeholder="Search contacts..." />
      </div>
    </div>
    <div class="table-toolbar__right">
      <button class="btn btn--secondary btn--sm">
        <i data-lucide="sliders-horizontal" class="btn__icon"></i>
        Filter
      </button>
      <button class="btn btn--secondary btn--sm">
        <i data-lucide="download" class="btn__icon"></i>
        Export
      </button>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th class="table__checkbox-col"><input type="checkbox" class="table__checkbox" /></th>
        <th class="sortable sorted">Name <i data-lucide="arrow-up" class="table__sort-icon"></i></th>
        <th class="sortable">Company <i data-lucide="arrow-up" class="table__sort-icon"></i></th>
        <th class="sortable">Status <i data-lucide="arrow-up" class="table__sort-icon"></i></th>
        <th class="sortable">Deal Value <i data-lucide="arrow-up" class="table__sort-icon"></i></th>
        <th class="table__actions-col"></th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="table__checkbox-col"><input type="checkbox" class="table__checkbox" /></td>
        <td>
          <div class="table__cell-with-avatar">
            <div class="table__avatar">JD</div>
            <div>
              <div class="table__cell-name">John Doe</div>
              <div class="table__cell-sub">john@acme.com</div>
            </div>
          </div>
        </td>
        <td class="muted">Acme Corp</td>
        <td><span class="badge badge--success"><span class="badge__dot"></span>Active</span></td>
        <td>$12,400</td>
        <td class="table__actions-col">
          <button class="table__action-btn">
            <i data-lucide="ellipsis" class="table__action-icon"></i>
          </button>
        </td>
      </tr>
      <tr>
        <td class="table__checkbox-col"><input type="checkbox" class="table__checkbox" /></td>
        <td>
          <div class="table__cell-with-avatar">
            <div class="table__avatar" style="background:var(--gray-600);">SM</div>
            <div>
              <div class="table__cell-name">Sarah Miller</div>
              <div class="table__cell-sub">sarah@globex.com</div>
            </div>
          </div>
        </td>
        <td class="muted">Globex Inc</td>
        <td><span class="badge badge--warning">At Risk</span></td>
        <td>$8,200</td>
        <td class="table__actions-col">
          <button class="table__action-btn">
            <i data-lucide="ellipsis" class="table__action-icon"></i>
          </button>
        </td>
      </tr>
      <tr>
        <td class="table__checkbox-col"><input type="checkbox" class="table__checkbox" /></td>
        <td>
          <div class="table__cell-with-avatar">
            <div class="table__avatar" style="background:var(--gray-500);">RK</div>
            <div>
              <div class="table__cell-name">Raj Kumar</div>
              <div class="table__cell-sub">raj@initech.com</div>
            </div>
          </div>
        </td>
        <td class="muted">Initech</td>
        <td><span class="badge badge--danger">Lost</span></td>
        <td>$3,800</td>
        <td class="table__actions-col">
          <button class="table__action-btn">
            <i data-lucide="ellipsis" class="table__action-icon"></i>
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="table-pagination">
    <span class="table-pagination__info">Showing 1–3 of 40</span>
    <div class="table-pagination__controls">
      <button class="table-pagination__btn" disabled>
        <i data-lucide="chevron-left" style="width:14px;height:14px;"></i>
      </button>
      <button class="table-pagination__btn table-pagination__btn--active">1</button>
      <button class="table-pagination__btn">2</button>
      <button class="table-pagination__btn">3</button>
      <button class="table-pagination__btn">
        <i data-lucide="chevron-right" style="width:14px;height:14px;"></i>
      </button>
    </div>
  </div>
</div>

    </div>
</main>



<!----->
</div>

<script>
  lucide.createIcons();

  const layout = document.getElementById('layout');
  const toggle = document.getElementById('sidebarToggle');
  toggle.addEventListener('click', () => {
    layout.classList.toggle('layout--collapsed');
  });
</script>

</body>
</html>
